name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure executable permissions on bin scripts
        run: chmod +x bin/*

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nf-core/setup-nextflow@v2
        with:
          version: '24.04.4'

      - name: Lint directory structure
        run: bash tests/lint_structure.sh

      - name: Lint container pins
        run: bash tests/lint_containers.sh

      - name: Parse test profile config
        run: nextflow config -profile test > /dev/null

      - name: Test stub run
        run: nextflow run . -profile test -stub-run

  profile-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nf-core/setup-nextflow@v2
        with:
          version: '24.04.4'

      - name: Parse slurm profile config
        run: nextflow config -profile slurm > /dev/null

      - name: Parse awsbatch profile config
        run: nextflow config -profile awsbatch > /dev/null

  nftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ["modules", "subworkflows", "e2e"]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure executable permissions on bin scripts
        run: chmod +x bin/*

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nf-core/setup-nextflow@v2
        with:
          version: '24.04.4'

      - name: Install nf-test
        run: |
          mkdir -p $HOME/.local/bin
          wget -qO- https://github.com/askimed/nf-test/releases/download/v0.9.2/nf-test-0.9.2.tar.gz | tar -xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run nf-test suite
        if: hashFiles(format('tests/{0}/**', matrix.suite)) != ''
        run: |
          nf-test test tests/${{ matrix.suite }}/** --profile docker

